services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: digest_user
      POSTGRES_PASSWORD: digest_pass
      POSTGRES_DB: digest_db
    ports:
      - "5432:5432"
    volumes:
      - digest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digest_user -d digest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/admin-tools:latest
    # --db-filename persists Schedules (and their next-run bookkeeping) to the
    # temporal_data volume, so a container restart - a laptop sleeping, colima
    # stopping, `docker-compose down` - doesn't silently wipe and recreate the
    # cron schedules from scratch. Without it, a restart resets each
    # schedule's clock to "now", so any fire time that was supposed to happen
    # while the container was down is lost with no error and no record - the
    # worker's idempotent re-creation on startup only avoids a duplicate-
    # schedule error, it doesn't restore what got missed. With persistence,
    # Temporal's own catchup window (365d by default, unset here) means a
    # schedule that comes back online after downtime fires its missed run
    # immediately instead of waiting for the next cron time.
    command: >
      temporal server start-dev
      --ip 0.0.0.0
      --port 7233
      --ui-port 8233
      --db-filename /home/temporal/temporal.db
    ports:
      - "7233:7233"   # gRPC frontend (SDK/worker connects here)
      - "8233:8233"   # Web UI: http://localhost:8233
    volumes:
      # /home/temporal is already owned by the image's non-root `temporal`
      # user (uid 1000); a fresh named volume mounted elsewhere (e.g. /data)
      # is created root-owned by Docker and the container can't write to it.
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    # Local SMTP catcher: emails sent by the app land here, not in a real
    # inbox, until SMTP_HOST/PORT are deliberately pointed at a real relay.
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://digest_user:digest_pass@db:5432/digest_db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUMMARY_BACKEND: ${SUMMARY_BACKEND:-anthropic}
      # Ollama runs natively on the Mac (GPU), bound to 127.0.0.1 only;
      # colima routes host.docker.internal to the Mac's loopback.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:12b}
      TEMPORAL_ADDRESS: temporal:7233
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-digest@example.com}
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://digest_user:digest_pass@db:5432/digest_db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUMMARY_BACKEND: ${SUMMARY_BACKEND:-anthropic}
      # Ollama runs natively on the Mac (GPU), bound to 127.0.0.1 only;
      # colima routes host.docker.internal to the Mac's loopback.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:12b}
      TEMPORAL_ADDRESS: temporal:7233
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-digest@example.com}
    volumes:
      - .:/code
    command: python -m app.worker

volumes:
  digest_pg_data:
  temporal_data:
