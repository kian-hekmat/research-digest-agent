{% extends "base.html" %}
{% block title %}Unsubscribed{% endblock %}
{% block content %}
<h1>You're unsubscribed{% if topic %} from {{ topic.name }}{% endif %}</h1>
<p>Changed your mind?</p>
<form method="post" action="/resubscribe">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="token" value="{{ token }}">
  <button type="submit">Re-subscribe</button>
</form>
{% endblock %}
