<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Papers Weekly{% endblock %} · Papers Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<link rel="stylesheet" href="/static/site.css">
{% block head %}{% endblock %}
</head>
<body>
<div class="site-header-bar">
<header class="site-header">
  <a class="wordmark" href="/signup">Papers Weekly</a>
  <nav>{% block nav %}<a href="/signup#manage">Manage subscription</a>{% endblock %}</nav>
</header>
</div>
<main>
{% block content %}{% endblock %}
</main>
<div class="site-footer-bar">
<footer class="site-footer">
  <p>Papers Weekly · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="https://github.com/kian-hekmat/research-digest-agent">Source</a></p>
  <p>Thank you to arXiv for use of its open access interoperability. Papers Weekly is not affiliated with or endorsed by arXiv.</p>
</footer>
</div>
<script src="/static/site.js" defer></script>
</body>
</html>
