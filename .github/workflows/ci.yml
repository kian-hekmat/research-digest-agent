name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: digest_user
          POSTGRES_PASSWORD: digest_pass
          POSTGRES_DB: digest_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digest_user -d digest_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://digest_user:digest_pass@localhost:5432/digest_test_db
        run: pytest -v
