name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Temporal's test servers are binaries the SDK downloads on first use.
      # Keep them in a cached directory and fetch them before the suite, so a
      # CDN hiccup can't fail whichever test happens to start a server first.
      TEMPORAL_TEST_SERVER_DIR: /home/runner/.cache/temporal-test-servers

    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-trixie  # postgres 16 + vector; trixie matches postgres:16's glibc (collation)
        env:
          POSTGRES_USER: digest_user
          POSTGRES_PASSWORD: digest_pass
          POSTGRES_DB: digest_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digest_user -d digest_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Temporal test servers
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/temporal-test-servers
          # requirements.txt pins temporalio, which pins the server versions.
          key: temporal-test-servers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Download Temporal test servers
        run: |
          mkdir -p "$TEMPORAL_TEST_SERVER_DIR"
          python -m tests.temporal_servers

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://digest_user:digest_pass@localhost:5432/digest_test_db
        run: pytest -v
